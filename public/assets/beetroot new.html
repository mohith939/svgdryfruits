act, effort, and dependencies where known.\\n\\n## Open questions\\nTrack what needs research or a product decision.\",\"prefillPrompt\":\"Organize a feature backlog for my product, grouping requests by user need and suggesting priorities and next decisions. Use details I’ve shared and relevant conversations and connected apps you can access; ask for what’s missing after checking them. Update this Page and preserve my edits.\",\"setupQuestion\":\"Which product is this for? You can paste a few ideas to get started.\",\"title\":\"Feature backlog\",\"id\":\"feature-backlog\",\"prompt\":\"Turn ideas and requests for my product into a feature backlog. Group similar requests, describe the user need, link supporting feedback, and suggest priorities and next decisions. Ask which product if it’s unclear; a few ideas are enough to start. Use the details I’ve shared and relevant conversations and connected apps you can access to fill in this Page. Ask for missing essentials only after checking that context. Update this Page and preserve my edits.\"},{\"id\":\"learning-plan\",\"previewDocument\":[{\"kind\":\"markdown\",\"markdown\":\"**Time:** Two 30-minute sessions a week\"},{\"markdown\":\"## 🎯 Outcome\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"Locate five major lunar features on a map and explain the difference between a crater and a dark plain in ordinary language.\"},{\"kind\":\"markdown\",\"markdown\":\"## 🧩 Starting point\"},{\"kind\":\"markdown\",\"markdown\":\"I can recognize the Moon’s broad light and dark areas. I want to connect those patterns with named places.\"},{\"kind\":\"markdown\",\"markdown\":\"## 🗺️ Learning path\"},{\"markdown\":\"| Step | Resource | Practice |\\n| --- | --- | --- |\\n| Get oriented | NASA Moon overview | Label five features on a sketch |\\n| Look closely | A library lunar atlas | Compare two images of one region |\\n| Explain it | My own notes | Write a 100-word visitor caption |\",\"layout\":\"normal\",\"kind\":\"markdown\"},{\"markdown\":\"## 📅 Weekly rhythm\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Tuesday: read one short section and draw a sketch.\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Sunday: revisit the sketch without looking at the labels.\"},{\"markdown\":\"- [ ] Explain one feature to a friend.\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"## 📝 Notebook\"},{\"kind\":\"markdown\",\"markdown\":\"**Observation:** The same region can look quite different as shadows change.\"},{\"kind\":\"markdown\",\"markdown\":\"**Question:** Which lighting makes a crater’s shape easiest to see?\"},{\"kind\":\"markdown\",\"markdown\":\"## 🔁 Progress check\"},{\"markdown\":\"I can locate three of the five features without the atlas. Compare those three under different lighting, then add two more and repeat the unlabeled sketch.\",\"kind\":\"markdown\"},{\"markdown\":\"## 🔗 Start here\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"[NASA Moon overview](https://science.nasa.gov/moon/)\"}],\"prompt\":\"Help me make a plan for something I want to learn. Start with what I already know and what I want to be able to do. Break it into manageable steps with useful resources, practice, and a weekly routine. Include space for notes and progress checks. Use the details I’ve shared and relevant conversations and connected apps you can access to fill in this Page. Ask for missing essentials only after checking that context. Replace the examples with my details and preserve my edits.\",\"setupQuestion\":\"What would you like to learn?\",\"prefillPrompt\":\"Make a learning plan with a clear goal, useful resources, practice, and a weekly routine. Use details I’ve shared and relevant conversations and connected apps you can access; ask for what’s missing after checking them. Replace the examples with my details and preserve my edits.\",\"title\":\"Learning plan\"},{\"prefillPrompt\":\"Make a realistic weekly plan around my priorities and commitments, with suggested focus time and room for rest. Use details I’ve shared and relevant conversations and connected apps you can access; ask for what’s missing after checking them. Replace the examples with my details and preserve my edits.\",\"id\":\"weekly-planner\",\"title\":\"Weekly planner\",\"previewDocument\":[{\"markdown\":\"## 🎯 Priorities\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Finish the lunar exhibit captions.\"},{\"markdown\":\"- [ ] Confirm volunteer roles for Friday.\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Leave one evening free of commitments.\"},{\"kind\":\"markdown\",\"markdown\":\"## 🗓️ Week at a glance\"},{\"layout\":\"normal\",\"kind\":\"markdown\",\"markdown\":\"| Day | Main focus | Commitment |\\n| --- | --- | --- |\\n| Monday | Caption edits | Review with Leo, 14:00 |\\n| Tuesday | Final captions and handout draft | Approve the full print set |\\n| Wednesday | Send approved files to the print shop | Volunteer call, 18:00 |\\n| Thursday | Collect prints and check the room | Free evening |\\n| Friday | Open house | Arrive at 17:15 |\\n| Weekend | Rest and a short walk | Sunday journal time |\"},{\"markdown\":\"## 🏡 Everyday life\",\"kind\":\"markdown\"},{\"markdown\":\"- [ ] Pick up groceries on the way home.\",\"kind\":\"markdown\"},{\"markdown\":\"- [ ] Return the library book.\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Call a friend over the weekend.\"},{\"kind\":\"markdown\",\"markdown\":\"## 📌 Can wait\"},{\"markdown\":\"The archive’s video section and the future talk schedule.\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"## ✨ Weekend review\"},{\"kind\":\"markdown\",\"markdown\":\"**What helped:** Did the shared caption review resolve questions before printing?\"},{\"kind\":\"markdown\",\"markdown\":\"**What to change:** Note any last-minute printing or role changes to allow for in the next event plan.\"}],\"setupQuestion\":\"What do you want to get done this week? Anything already on your calendar?\",\"prompt\":\"Plan my week around the priorities and commitments I’ve shared. Create a short priority list and a realistic day-by-day plan with suggested focus time and room for rest. Ask what matters most this week if you need a starting point. Use the details I’ve shared and relevant conversations and connected apps you can access to fill in this Page. Ask for missing essentials only after checking that context. Replace the examples with my details and preserve my edits.\"},{\"title\":\"Trip planner\",\"previewDocument\":[{\"kind\":\"markdown\",\"markdown\":\"**Travelers:** Maya and Sam  \\n**Pace:** One main activity a day\"},{\"kind\":\"markdown\",\"markdown\":\"## 🧭 The plan\"},{\"kind\":\"markdown\",\"markdown\":\"Plan two nights near a mountain observatory. The visitor tour is the main activity; confirm its availability before choosing transport and accommodation.\"},{\"kind\":\"markdown\",\"markdown\":\"## 🚆 Travel and stay\"},{\"layout\":\"normal\",\"markdown\":\"| Item | Plan | Status |\\n| --- | --- | --- |\\n| Outbound | Friday afternoon train, then local shuttle | Compare departure times |\\n| Accommodation | Two nights in the village | Choose a flexible booking |\\n| Return | Sunday afternoon train | Leave time for lunch |\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"## 🗓️ Daily outline\"},{\"kind\":\"markdown\",\"layout\":\"normal\",\"markdown\":\"| Day | Main plan | Flexible alternative |\\n| --- | --- | --- |\\n| Friday | Arrive and settle in | Short village walk |\\n| Saturday | Observatory visitor tour | Science museum if tours change |\\n| Sunday | Easy morning walk | Café and photo journal |\"},{\"kind\":\"markdown\",\"markdown\":\"## 🎒 Before leaving\"},{\"markdown\":\"- [ ] Check the visitor schedule, reserve the tour if required, and review the weather before departure.\",\"kind\":\"markdown\"},{\"markdown\":\"- [ ] Confirm transport and accommodation.\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Save tickets and maps offline.\"},{\"markdown\":\"- [ ] Pack warm layers, walking shoes, and a notebook.\",\"kind\":\"markdown\"},{\"markdown\":\"## 💡 Useful notes\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"Use a $450 planning allowance for two people: $300 for two nights, $120 for meals, and $30 for local transport. Intercity tickets and any tour fees are additional; confirm actual prices before booking. Keep skywatching optional.\"}],\"setupQuestion\":\"Where would you like to go—or would you like help choosing?\",\"id\":\"trip-planner\",\"prompt\":\"Make a flexible itinerary and planning checklist using the trip details I’ve shared. Include ideas for activities, transport, and accommodation, keeping confirmed bookings easy to identify. Ask where I’d like to go if needed, or help me choose a destination. Use the details I’ve shared and relevant conversations and connected apps you can access to fill in this Page. Ask for missing essentials only after checking that context. Replace the examples with my details and preserve my edits.\",\"prefillPrompt\":\"Make a flexible trip itinerary and planning checklist, including activities, transport, and accommodation. Help me choose a destination if needed. Use details I’ve shared and relevant conversations and connected apps you can access; ask for what’s missing after checking them. Replace the examples with my details and preserve my edits.\"},{\"title\":\"Budget tracker\",\"prompt\":\"Use relevant financial information from connected apps you can access to build my budget tracker. Organize income and spending, show how they compare, and help me track progress toward my goals. Use the currency shown in my accounts and start with this month unless I specify otherwise. Keep totals for different currencies separate. Use the details I’ve already shared, and ask for missing essentials only after checking the available information. If no financial information is available, start with an editable budget and ask what I’d like to add. Update this Page and preserve my edits.\",\"setupQuestion\":\"What would you like help with—tracking spending, saving toward a goal, or both?\",\"previewMarkdown\":\"## Budget period\\nAdd the time period and currency.\\n\\n## Planned and actual spending\\n| Category | Planned | Actual | Remaining |\\n| --- | --- | --- | --- |\\n| Housing | | | |\\n| Food | | | |\\n| Transport | | | |\\n\\n## Transactions\\nAdd income and expenses with dates and sources.\\n\\n## Review\\nNote missing figures and changes for next period.\",\"id\":\"budget-tracker\",\"prefillPrompt\":\"Use financial information from connected apps you can access and details I’ve shared to make a budget tracker for this month. Organize income and spending and track my savings goals, using my accounts’ currencies and keeping their totals separate. If no figures are available, help me start an editable budget. Update this Page and preserve my edits.\"},{\"title\":\"Apartment hunter\",\"setupQuestion\":\"Where are you looking, and what is your rent budget?\",\"previewMarkdown\":\"## Search criteria\\nAdd location, budget, move-in timing, and must-haves.\\n\\n## Shortlist\\n| Listing | Rent and fees | Availability | Notes |\\n| --- | --- | --- | --- |\\n\\n## Next steps\\n- [ ] Save listings to compare\\n- [ ] Prepare questions for a viewing\\n\\n## Viewing notes\\nRecord observations and questions for each apartment.\",\"prompt\":\"Organize my apartment search around my location and rent budget. Compare available listings by rent, fees, availability, and my preferences, with links and next steps. If I haven’t added listings yet, start with search criteria and a comparison table. Use the details I’ve shared and relevant conversations and connected apps you can access to fill in this Page. Ask for missing essentials only after checking that context. Update this Page and preserve my edits.\",\"prefillPrompt\":\"Help me compare apartments by rent, fees, availability, and my preferences, with listing links and next steps. Use details I’ve shared and relevant conversations and connected apps you can access; ask for what’s missing after checking them. Update this Page and preserve my edits.\",\"id\":\"apartment-hunter\"},{\"prefillPrompt\":\"Help me plan my event, including the schedule, people involved, preparation, and follow-up. Use the details I’ve shared and relevant conversations and connected apps you can access to fill in this Page. Ask for missing essentials only after checking that context. Replace the examples with my details and preserve my edits.\",\"id\":\"event-plan\",\"prompt\":\"Make a plan for my event with its purpose, key details, schedule, people involved, and preparation checklist. Include a backup plan and follow-up tasks where useful. Use the details I’ve shared and relevant conversations and connected apps you can access to fill in this Page. Ask for missing essentials only after checking that context. Replace the examples with my details and preserve my edits.\",\"setupQuestion\":\"What event are you planning?\",\"previewDocument\":[{\"kind\":\"markdown\",\"markdown\":\"**Time:** 18:00–20:00 local time  \\n**Place:** Northfield Observatory visitor hall  \\n**Lead:** Sam Rivera\"},{\"markdown\":\"## 🌙 Purpose\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"An informal evening of lunar images, short talks, and questions for first-time visitors.\"},{\"markdown\":\"## 📋 Essentials\",\"kind\":\"markdown\"},{\"layout\":\"normal\",\"markdown\":\"| Item | Plan |\\n| --- | --- |\\n| Capacity | 40 visitors |\\n| Planning budget | $300 total: $100 printing and $200 refreshments |\\n| Access | Step-free entrance, seating, large-print handouts |\\n| Main contact | Sam at the welcome desk |\",\"kind\":\"markdown\"},{\"markdown\":\"## 🕰️ Run of show\",\"kind\":\"markdown\"},{\"layout\":\"normal\",\"markdown\":\"| Time | Activity | Lead |\\n| --- | --- | --- |\\n| 17:15 | Set up and volunteer briefing | Sam |\\n| 18:00 | Welcome and image gallery | Maya |\\n| 18:30 | A short tour of the lunar landscape | Priya |\\n| 19:00 | Indoor questions; outdoor viewing if conditions allow | Priya |\\n| 20:00 | Close and reset the room | Team |\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"## ✅ Preparation\"},{\"markdown\":\"- [ ] Sam: confirm the room layout and step-free visitor route.\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Maya: print 50 handouts and the caption cards before the room check.\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Priya: confirm the observing setup and brief volunteers on the indoor alternative.\"},{\"kind\":\"markdown\",\"markdown\":\"## ☁️ If plans change\"},{\"kind\":\"markdown\",\"markdown\":\"At 16:00, Sam confirms whether outdoor viewing will run. The indoor event goes ahead either way. Sam updates the welcome desk and guest message; if viewing is cancelled, Priya extends the indoor questions and image discussion.\"},{\"kind\":\"markdown\",\"markdown\":\"## 📝 Afterwards\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Gather short visitor comments.\"},{\"kind\":\"markdown\",\"markdown\":\"- [ ] Record useful changes for the next event.\"}],\"title\":\"Event Plan\"},{\"setupQuestion\":\"What would you like to work toward?\",\"title\":\"Personal goals\",\"id\":\"personal-goals\",\"prompt\":\"Help me turn the goals I care about into a practical plan. Capture why each goal matters, what progress would look like, and a few steps I can take this week. Suggest ways to make time for them and include a short review section. Use the details I’ve shared and relevant conversations and connected apps you can access to fill in this Page. Ask for missing essentials only after checking that context. Replace the examples with my details and preserve my edits.\",\"prefillPrompt\":\"Help me make a plan for my personal goals, with signs of progress, a few steps for this week, and time to review how it’s going. Use the details I’ve shared and relevant conversations and connected apps you can access to fill in this Page. Ask for missing essentials only after checking that context. Replace the examples with my details and preserve my edits.\",\"previewDocument\":[{\"markdown\":\"**Review:** Last Sunday of each month\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"## 🧭 What matters\"},{\"markdown\":\"Over the next twelve weeks, learn a few lunar features, finish a photo journal, and keep one evening a week free.\",\"kind\":\"markdown\"},{\"markdown\":\"## 🎯 Goals\",\"kind\":\"markdown\"},{\"layout\":\"normal\",\"kind\":\"markdown\",\"markdown\":\"| Goal | Why | A useful sign of progress |\\n| --- | --- | --- |\\n| Learn the lunar landscape | Make skywatching more rewarding | Recognize five named features |\\n| Make a small photo journal | Finish something tangible | Twelve images with captions |\\n| Protect unplanned time | Leave room to rest | One free evening each week |\"},{\"markdown\":\"## 👣 This week\",\"kind\":\"markdown\"},{\"markdown\":\"- [ ] Borrow a Moon guide from the library.\",\"kind\":\"markdown\"},{\"markdown\":\"- [ ] Choose the first three journal images.\",\"kind\":\"markdown\"},{\"markdown\":\"- [ ] Keep Thursday evening free.\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"## 🗓️ Make room\"},{\"kind\":\"markdown\",\"markdown\":\"Reserve half an hour on Sunday for the journal. Join one astronomy-club evening each month. Pause the second online course until the next review.\"},{\"markdown\":\"## 🔁 Monthly review\",\"kind\":\"markdown\"},{\"kind\":\"markdown\",\"markdown\":\"**Progress:** The journal theme is chosen and twelve images are shortlisted.\"},{\"kind\":\"markdown\",\"markdown\":\"**Lesson:** Short sessions are easier to keep than a whole afternoon.\"},{\"kind\":\"markdown\",\"markdown\":\"**Adjustment:** Finish one caption each week so all twelve images are ready by the end of this plan.\"}]}],\"recommendations\":{\"business\":[\"to-do-list\",\"project-tracker\",\"weekly-update\",\"release-notes\",\"feature-backlog\",\"event-plan\"],\"fallback\":[\"to-do-list\",\"project-tracker\",\"weekly-planner\",\"personal-goals\"],\"individual\":[\"to-do-list\",\"project-tracker\",\"trip-planner\",\"weekly-planner\",\"budget-tracker\",\"apartment-hunter\",\"personal-goals\"],\"education\":[\"to-do-list\",\"project-tracker\",\"learning-plan\",\"weekly-planner\",\"personal-goals\"]}},\"templates\":[{\"title\":\"To-do list\",\"prompt\":\"Check my relevant connected apps and create a to-do checklist. Automatically update every morning at 6am in my browser time zone: check off completed tasks for me, and carry forward incomplete tasks to the next day.\",\"prefillPrompt\":\"Help me turn this Page into my to-do list. Check relevant conversations and connected apps you can access for things I need to do. If you can’t find enough, ask me what to add. Replace the sample tasks, keep the checkboxes and any edits I’ve made, and don’t invent tasks or deadlines.\",\"id\":\"to-do-list\",\"previewMarkdown\":\"## Today\\n\\n### Top priorities\\n\\n- [ ] Run propulsion test\\n\\n- [ ] Verify course calculations\\n\\n- [ ] Inspect fuel tanks\\n\\n### If time allows\\n\\n- [ ] Inspect radiation shields\\n\\n- [ ] Test communication systems\\n\\n- [ ] Write status report\"},{\"previewDocument\":[{\"kind\":\"markdown\",\"markdown\":\"## 🔴 Needs immediate attention\"},{\"kind\":\"markdown\",\"markdown\":\"- Communication systems test for launch\"},{\"kind\":\"markdown\",\"markdown\":\"## ⛰️ Milestones\"},{\"kind\":\"markdown\",\"layout\":\"flexible\",\"markdown\":\"| Milestone | Status |\\n| - | - |\\n| \u003cul\u003e\u003cli data-checked=\\\"false\\\"\u003e\u003cp\u003eProject brief\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e | Complete |\\n| \u003cul\u003e\u003cli data-checked=\\\"false\\\"\u003e\u003cp\u003ePrototype review\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e | In progre w to add the section to the homepage.\\nExplain how to test mouse rotation, touch interaction, and responsive behavior.\\n\\nThe result should feel like a premium interactive 3D wellness ecommerce experience inspired by a rotating globe, with the actual ABC+ pouch as the centerpiece.\\n:::\",8925,11896,[],[],\"You are an expert Three.js developer specializing in interactive 3D ecommerce product experiences.\\n\\nI want to create a globe-like interactive product animation for the NUTRONYX ABC+ Shopify homepage.\\n\\nI will provide:\\n1. My actual ABC+ pouch front image.\\n2. My pouch back image, if available.\\n3. Transparent PNG images of amla, beetroot, carrot, ginger, and lemon.\\n\\nOBJECTIVE:\\nCreate an interactive 3D spherical ingredient composition around a floating ABC+ pouch.\\n\\nINTERACTION:\\nWhen the user moves the mouse across the hero section:\\n- The entire ingredient sphere should rotate smoothly.\\n- The rotation should respond naturally to mouse movement.\\n- Horizontal mouse movement should control horizontal rotation.\\n- Vertical mouse movement should control vertical rotation.\\n- Rotation should have smooth easing and inertia.\\n- When the mouse stops, the sphere should gradually slow down.\\n- When the cursor leaves the hero section, the scene should gently return to a subtle idle animation.\\n\\n3D COMPOSITION:\\n- Place the ABC+ pouch at the center.\\n- Position ingredients around an invisible spherical orbit.\\n- Arrange the ingredients at different depths.\\n- Add subtle floating motion.\\n- Use realistic scale differences.\\n- Keep the pouch readable and prominent.\\n- Use natural shadows and lighting.\\n\\nPRODUCT:\\nUse my exact pouch image.\\nDo not change the packaging artwork or branding.\\n\\nIf only the front pouch image is available:\\n- Create a flat transparent plane with the pouch image.\\n- Add a slight thickness illusion if appropriate.\\n- Do not invent the rear packaging artwork.\\n- Make the pouch rotate only within a realistic limited range.\\n- Avoid showing the flat image from extreme side angles.\\n\\nTECHNOLOGY:\\nUse Three.js.\\nUse transparent PNG textures.\\nUse a perspective camera.\\nUse a parent group for the spherical ingredient composition.\\nImplement pointer-based rotation using normalized mouse coordinates.\\nUse requestAnimationFrame.\\nUse damping / interpolation for smooth motion.\\nOptimize rendering performance.\\nSupport mobile touch interaction.\\nRespect reduced-motion accessibility settings.\\n\\nSHOPIFY:\\nProvide a complete Shopify-compatible implementation.\\nSeparate the code into:\\n- Liquid section\\n- HTML structure\\n- CSS\\n- JavaScript\\n- Asset loading\\n\\nAllow customization through Shopify section settings:\\n- Product pouch image\\n- Ingredient images\\n- Rotation sensitivity\\n- Floating animation speed\\n- Sphere radius\\n- Background color\\n- Desktop/mobile sizing\\n\\nOUTPUT:\\nProvide the full working code, not pseudocode.\\nExplain exactly where every file should be placed in Shopify.\\nExplain how to upload images to Shopify Files and reference them.\\nExplain how to add the section to the homepage.\\nExplain how to test mouse rotation, touch interaction, and responsive behavior.\\n\\nThe result should feel like a premium interactive 3D wellness ecommerce experience inspired by a rotating globe, with the actual ABC+ pouch as the centerpiece.\",\"83523\",{\"_95\":840,\"_90\":841,\"_201\":202,\"_203\":154},\":::writing{variant=\\\"standard\\\" id=\\\"83522\\\"}\\nCreate a premium cinematic product animation for NUTRONYX ABC+ Daily Wellness Powder.\\n\\nREFERENCE:\\nUse my uploaded ABC+ pouch image as the exact packaging reference.\\n\\nThe packaging must remain identical to the reference:\\n- Same white pouch\\n- Same Nutronyx tree logo\\n- Same ABC+ typography\\n- Same burgundy lower section\\n- Same ingredient text\\n- Same proportions and branding\\n\\nDo not redesign, replace, distort, or invent packaging details.\\n\\nSCENE:\\nA luxurious natural wellness product hero scene on a warm ivory background.\\n\\nThe ABC+ pouch floats in the center of the composition.\\n\\nSurround it with realistic botanical ingredients:\\n- Amla / Indian gooseberry\\n- Beetroot\\n- Carrot\\n- Ginger\\n- Lemon\\n\\nThe ingredients float around the pouch in a sophisticated spherical arrangement.\\n\\nANIMATION:\\nThe pouch gently floats in the air.\\nIngredients move slowly around it along elegant circular orbital paths.\\nThe scene should feel like a premium 3D wellness advertisement.\\n\\nCAMERA:\\n- Centered product composition\\n- Slight perspective depth\\n- Slow cinematic movement\\n- Product remains clearly visible\\n- No rapid camera movement\\n- No dramatic zooms\\n- Clean premium studio lighting\\n\\nSTYLE:\\nLuxury wellness ecommerce.\\nPhotorealistic CGI.\\nEditorial art direction.\\nSoft shadows.\\nNatural highlights.\\nHigh-end commercial product photography.\\n\\nIMPORTANT:\\nDo not generate text overlays, additional logos, watermarks, or fake product labels.\\nPreserve the product packaging as accurately as possible.\\n\\nOUTPUT:\\nCreate a seamless looping animation suitable for a premium ecommerce homepage hero.\\n\\nPreferred:\\n- 6–10 seconds\\n- Smooth loop\\n- 16:9 composition\\n- Product centered\\n- Background clean and minimal\\n- High resolution\\n\\nThe final animation should look like an expensive premium supplement brand campaign, not a generic AI advertisement.\\n:::\",6765,8625,[],[],\"Create a premium cinematic product animation for NUTRONYX ABC+ Daily Wellness Powder.\\n\\nREFERENCE:\\nUse my uploaded ABC+ pouch image as the exact packaging reference.\\n\\nThe packaging must remain identical to the reference:\\n- Same white pouch\\n- Same Nutronyx tree logo\\n- Same ABC+ typography\\n- Same burgundy lower section\\n- Same ingredient text\\n- Same proportions and branding\\n\\nDo not redesign, replace, distort, or invent packaging details.\\n\\nSCENE:\\nA luxurious natural wellness pr PORTANT:\\nUse my actual ABC+ pouch from Reference Image 2 as the central hero product. Do not use a cylindrical container, jar, bottle, or generic supplement packaging.\\n\\nDESIGN OBJECTIVE:\\nRecreate the visual quality, layout, atmosphere, and premium aesthetics of Reference Image 1 while adapting the product presentation to my pouch packaging.\\n\\nBRAND:\\nNUTRONYX\\nTagline: DAILY WELLNESS, MADE EASY\\nProduct: ABC+ Daily Wellness Powder\\nIngredients: Amla, Beetroot, Carrot, Ginger, Lemon\\nNet Weight: 200 g\\n\\nHERO LAYOUT:\\n\\n1. HEADER\\n- Nutronyx logo on the left\\n- Navigation: Home, Shop, About, Ingredients, Benefits\\n- Search, Account, and Cart icons on the right\\n- Minimal, elegant, transparent header\\n- Responsive mobile navigation\\n\\n2. LEFT CONTENT\\n- Small eyebrow text: DAILY NUTRITION / NATURAL INGREDIENTS / LASTING WELLNESS\\n- Main headline:\\n  \\\"Nature's\\n   Goodness.\\n   Simplified.\\\"\\n- Supporting description:\\n  \\\"A premium daily wellness powder crafted with nature's finest ingredients to support your everyday well-being.\\\"\\n- CTA button: \\\"Discover ABC+\\\"\\n- Premium editorial typography with a large elegant serif heading\\n\\n3. CENTER PRODUCT VISUAL\\n- Use the uploaded ABC+ pouch image as the exact product reference.\\n- Remove the background from the pouch if necessary.\\n- Keep the pouch branding, packaging, typography, colors, and proportions unchanged.\\n- Create a realistic floating product composition.\\n- Add natural ingredients around the pouch: amla, beetroot, carrot, ginger, lemon.\\n- Use realistic shadows, reflections, subtle lighting, and depth.\\n- The product should appear premium and photorealistic.\\n\\n4. RIGHT INGREDIENT PANEL\\nShow five ingredients in a vertically aligned list:\\nAmla — Immunity \u0026 vitality\\nBeetroot — Natural nourishment\\nCarrot — Antioxidant support\\nGinger — Digestive wellness\\nLemon — Natural refreshment\\n\\nUse elegant thin connecting lines and small ingredient visuals.\\n\\n5. BACKGROUND\\n- Warm ivory / cream\\n- Subtle organic texture\\n- Soft botanical shadows\\n- Natural studio lighting\\n- Minimal luxury aesthetic\\n\\n6. INTERACTION\\nThe center pouch should rotate interactively based on mouse movement.\\nImplement a true interactive 3D product experience if possible.\\nMouse movement should influence rotation smoothly.\\nThe product should return gently toward its resting position when the cursor leaves.\\nSupport touch interaction on mobile.\\n\\nTECHNICAL REQUIREMENTS:\\n- Build this as a Shopify Online Store 2.0 theme section.\\n- Use Liquid, HTML, CSS, and JavaScript.\\n- Use Three.js only if necessary for the 3D interaction.\\n- Do not use external APIs that require paid keys.\\n- Make all text, colors, images, spacing, and buttons configurable through Shopify section settings.\\n- Include responsive desktop, tablet, and mobile layouts.\\n- Ensure good performance, accessibility, and SEO.\\n- Avoid unnecessary animation libraries.\\n- Use CSS transforms or Three.js appropriately.\\n\\nOUTPUT:\\n1. Explain the proposed architecture.\\n2. Provide complete Shopify section code.\\n3. Provide CSS and JavaScript.\\n4. Explain how to install the section in Shopify.\\n5. Explain how to upload and connect my product image.\\n6. Explain how to customize text, images, and settings.\\n7. Provide a checklist for testing responsiveness and performance.\\n\\nDo not merely create a static mockup. I need a functional, production-oriented Shopify hero section.\\n:::\",2871,6673,[],[],\"You are a senior Shopify theme developer, creative director, and award-winning 3D web designer specializing in premium wellness and supplement ecommerce brands.\\n\\nI want you to build a premium Shopify homepage hero section for my brand NUTRONYX.\\n\\nI have uploaded two reference images:\\n- Reference Image 1: The visual design inspiration for the website hero.\\n- Reference Image 2: My actual ABC+ supplement pouch packaging.\\n\\nIMPORTAN suals.\\n\\n5. BACKGROUND\\n- Warm ivory / cream\\n- Subtle organic texture\\n- Soft botanical shadows\\n- Natural studio lighting\\n- Minimal luxury aesthetic\\n\\n6. INTERACTION\\nThe center pouch should rotate interactively based on mouse movement.\\nImplement a true interactive 3D product experience if possible.\\nMouse movement should influence rotation smoothly.\\nThe product should return gently toward its resting position when the cursor leaves.\\nSupport touch interaction on mobile.\\n\\nTECHNICAL REQUIREMENTS:\\n- Build this as a Shopify Online Store 2.0 theme section.\\n- Use Liquid, HTML, CSS, and JavaScript.\\n- Use Three.js only if necessary for the 3D interaction.\\n- Do not use external APIs that require paid keys.\\n- Make all text, colors, images, spacing, and buttons configurable through Shopify section settings.\\n- Include responsive desktop, tablet, and mobile layouts.\\n- Ensure good performance, accessibility, and SEO.\\n- Avoid unnecessary animation libraries.\\n- Use CSS transforms or Three.js appropriately.\\n\\nOUTPUT:\\n1. Explain the proposed architecture.\\n2. Provide complete Shopify section code.\\n3. Provide CSS and JavaScript.\\n4. Explain how to install the section in Shopify.\\n5. Explain how to upload and connect my product image.\\n6. Explain how to customize text, images, and settings.\\n7. Provide a checklist for testing responsiveness and performance.\\n\\nDo not merely create a static mockup. I need a functional, production-oriented Shopify hero section.\",\"83521\",[223],{\"_90\":852,\"_853\":11,\"_854\":11,\"_855\":-5},\"kly8oi\",\"edited\",\"previewable\",\"preview_language\",\"function __dilSafe(evaluate,failureValue){try{return evaluate()}catch{return failureValue}}\\n\\nDIL.render(__dil.jsx(()=\u003e{const __dilConstants=DIL.useConstants();const __dilModelDataBindings=DIL.useAppData((appData)=\u003eappData.opGenui?.modelDataBindings??{});return __dil.jsx(__dil.Fragment,null,__dil.jsx(\\\"text\\\",null,__dilConstants[\ 9\":1220,\"_1221\":1222,\"_1223\":1224,\"_1225\":1226,\"_1227\":1228,\"_1229\":1230,\"_1231\":1232,\"_1233\":1234,\"_1235\":1236,\"_1237\":1238,\"_1239\":1240,\"_1241\":1242,\"_1243\":360,\"_1244\":362,\"_1245\":364,\"_1246\":245,\"_1247\":367,\"_1248\":369,\"_1249\":364,\"_1250\":247,\"_1251\":367,\"_1252\":374,\"_1253\":364,\"_1254\":249,\"_1255\":367,\"_1256\":379,\"_1257\":251,\"_1258\":382,\"_1259\":384},\"Buddy, yes\\\\! You can recreate this exact premium Nutronyx Shopify hero section using **Shopify + Gemini + Google Flow**\\\\.\\n\\nI've understood your reference images\\\\:\\n\\n- **Image 1\\\\:** The target website design — premium, minimal, natural wellness aesthetic, floating product composition, botanical ingredients, and elegant typography.\\n- **Image 2\\\\:** Your actual Nutronyx ABC+ pouch — this should replace the cylindrical container in the reference.\\n\\nThe most important part is the center animation: **your ABC+ pouch should float in the center of an invisible 3D sphere, rotating interactively according to mouse movement, like a globe.**\\n\\n## 1\\\\. What you need to build\\nimage_group{\\\"query\\\":[\\\"premium natural wellness ecommerce hero section cream background floating supplement pouch ingredients\\\",\\\"premium supplement packaging product photography beetroot ginger carrot lemon amla\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\"}\\n\\nYour Shopify homepage should have\\\\:\\n\\n| Element | Implementation |\\n|--------|--------|\\n| Header | Logo, Home, Shop, About, Ingredients, Benefits |\\n| Left side | Large editorial headline + description + CTA |\\n| Center | Animated 3D ABC+ pouch |\\n| Surroundings | Amla, beetroot, carrot, ginger, lemon |\\n| Right side | Ingredient names + benefits |\\n| Background | Warm ivory / cream |\\n| Bottom | Scroll indicator |\\n| Interaction | Mouse-controlled 3D rotation |\\n| Mobile | Responsive layout with touch-based rotation |\\n\\n## 2\\\\. Required images and assets\\n\\nYou already have the most important asset: the ABC+ pouch.\\n\\nimage_group{\\\"query\\\":[\\\"premium supplement pouch white stand up zip pouch front view product photography\\\"],\\\"aspect_ratio\\\":\\\"3:4\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**1\\\\. ABC+ pouch image**\\n\\nYour uploaded `abc front(1).jpeg`\\n\\nBest if transparent background PNG. If not, remove the background before using it in the animation.\\n\\nimage_group{\\\"query\\\":[\\\"fresh amla indian gooseberry isolated white background\\\"],\\\"aspect_ratio\\\":\\\"1:1\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**2\\\\. Ingredient images**\\n\\nAmla, beetroot, carrot, ginger, lemon. Ideally transparent PNGs or realistic 3D renders.\\n\\nimage_group{\\\"query\\\":[\\\"minimal premium ivory cream paper texture background\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**3\\\\. Background**\\n\\nCream / ivory background with subtle fabric or paper texture.\\n\\nimage_group{\\\"query\\\":[\\\"minimal botanical tree logo green black premium wellness branding\\\"],\\\"aspect_ratio\\\":\\\"3:2\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**4\\\\. Nutronyx logo**\\n\\nTransparent PNG or SVG. Prefer your original logo.\\n\\nAdditional optional assets\\\\:\\n\\n- Transparent ingredient cutouts\\n- Pouch back image for realistic 3D rotation\\n- Pouch side image\\n- SVG icons for search, account, cart\\n- Brand fonts (elegant serif + modern sans-serif)\\n\\n## 3\\\\. Exact prompt for Gemini — website design and Shopify development\\n\\n(Prompt 1 · Gemini)\\n\\n:::writing{variant=\\\"standard\\\" id=\\\"83521\\\"}\\nYou are a senior Shopify theme developer, creative director, and award-winning 3D web designer specializing in premium wellness and supplement ecommerce brands.\\n\\nI want you to build a premium Shopify homepage hero section for my brand NUTRONYX.\\n\\nI have uploaded two reference images:\\n- Reference Image 1: The visual design inspiration for the website hero.\\n- Reference Image 2: My actual ABC+ supplement pouch packaging.\\n\\nIMPORTANT:\\nUse my actual ABC+ pouch from Reference Image 2 as the central hero product. Do not use a cylindrical container, jar, bottle, or generic supplement packaging.\\n\\nDESIGN OBJECTIVE:\\nRecreate the visual quality, layout, atmosphere, and premium aesthetics of Reference Image 1 while adapting the product presentation to my pouch packaging.\\n\\nBRAND:\\nNUTRONYX\\nTagline: DAILY WELLNESS, MADE EASY\\nProduct: ABC+ Daily Wellness Powder\\nIngredients: Amla, Beetroot, Carrot, Ginger, Lemon\\nNet Weight: 200 g\\n\\nHERO LAYOUT:\\n\\n1. HEADER\\n- Nutronyx logo on the left\\n- Navigation: Home, Shop, About, Ingredients, Benefits\\n- Search, Account, and Cart icons on the right\\n- Minimal, elegant, transparent header\\n- Responsive mobile navigation\\n\\n2. LEFT CONTENT\\n- Small eyebrow text: DAILY NUTRITION / NATURAL INGREDIENTS / LASTING WELLNESS\\n- Main headline:\\n  \\\"Nature's\\n   Goodness.\\n   Simplified.\\\"\\n- Supporting description:\\n  \\\"A premium daily wellness powder crafted with nature's finest ingredients to support your everyday well-being.\\\"\\n- CTA button: \\\"Discover ABC+\\\"\\n- Premium editorial typography with a large elegant serif heading\\n\\n3. CENTER PRODUCT VISUAL\\n- Use the uploaded ABC+ pouch image as the exact product reference.\\n- Remove the background from the pouch if necessary.\\n- Keep the pouch branding, packaging, typography, colors, and proportions unchanged.\\n- Create a realistic floating product composition.\\n- Add natural ingredients around the pouch: amla, beetroot, carrot, ginger, lemon.\\n- Use realistic shadows, reflections, subtle lighting, and depth.\\n- The product should appear premium and photorealistic.\\n\\n4. RIGHT INGREDIENT PANEL\\nShow five ingredients in a vertically aligned list:\\nAmla — Immunity \u0026 vitality\\nBeetroot — Natural nourishment\\nCarrot — Antioxidant support\\nGinger — Digestive wellness\\nLemon — Natural refreshment\\n\\nUse elegant thin connecting lines and small ingredient visuals.\\n\\n5. BACKGROUND\\n- Warm ivory / cream\\n- Subtle organic texture\\n- Soft botanical shadows\\n- Natural studio lighting\\n- Minimal luxury aesthetic\\n\\n6. INTERACTION\\nThe center pouch should rotate interactively based on mouse movement.\\nImplement a true interactive 3D product experience if possible.\\nMouse movement should influence rotation smoothly.\\nThe product should return gently toward its resting position when the cursor leaves.\\nSupport touch interaction on mobile.\\n\\nTECHNICAL REQUIREMENTS:\\n- Build this as a Shopify Online Store 2.0 theme section.\\n- Use Liquid, HTML, CSS, and JavaScript.\\n- Use Three.js only if necessary for the 3D interaction.\\n- Do not use external APIs that require paid keys.\\n- Make all text, colors, images, spacing, and buttons configurable through Shopify section settings.\\n- Include responsive desktop, tablet, and mobile layouts.\\n- Ensure good performance, accessibility, and SEO.\\n- Avoid unnecessary animation libraries.\\n- Use CSS transforms or Three.js appropriately.\\n\\nOUTPUT:\\n1. Explain the proposed architecture.\\n2. Provide complete Shopify section code.\\n3. Provide CSS and JavaScript.\\n4. Explain how to install the section in Shopify.\\n5. Explain how to upload and connect my product image.\\n6. Explain how to customize text, images, and settings.\\n7. Provide a checklist for testing responsiveness and performance.\\n\\nDo not merely create a static mockup. I need a functional, production-oriented Shopify hero section.\\n:::\\n\\n## 4\\\\. Exact prompt for Google Flow — animated product visuals\\n\\n(Prompt 2 · Google Flow)\\n\\n:::writing{variant=\\\"standard\\\" id=\\\"83522\\\"}\\nCreate a premium cinematic product animation for NUTRONYX ABC+ Daily Wellness Powder.\\n\\nREFERENCE:\\nUse my uploaded ABC+ pouch image as the exact packaging reference.\\n\\nThe packaging must remain identical to the reference:\\n- Same white pouch\\n- Same Nutronyx tree logo\\n- Same ABC+ typography\\n- Same burgundy lower section\\n- Same ingredient text\\n- Same proportions and branding\\n\\nDo not redesign, replace, distort, or invent packaging details.\\n\\nSCENE:\\nA luxurious natural wellness product hero scene on a warm ivory background.\\n\\nThe ABC+ pouch floats in the center of the composition.\\n\\nSurround it with realistic botanical ingredients:\\n- Amla / Indian gooseberry\\n- Beetroot\\n- Carrot\\n- Ginger\\n- Lemon\\n\\nThe ingredients float around the pouch in a sophisticated spherical arrangement.\\n\\nANIMATION:\\nThe pouch gently floats in the air.\\nIngredients move slowly around it along elegant circular orbital paths.\\nThe scene should feel like a premium 3D wellness advertisement.\\n\\nCAMERA:\\n- Centered product composition\\n- Slight perspective depth\\n- Slow cinematic movement\\n- Product remains clearly visible\\n- No rapid camera movement\\n- No dramatic zooms\\n- Clean premium studio lighting\\n\\nSTYLE:\\nLuxury wellness ecommerce.\\nPhotorealistic CGI.\\nEditorial art direction.\\nSoft shadows.\\nNatural highlights.\\nHigh-end commercial product photography.\\n\\nIMPORTANT:\\nDo not generate text overlays, additional logos, watermarks, or fake product labels.\\nPreserve the product packaging as accurately as possible.\\n\\nOUTPUT:\\nCreate a seamless looping animation suitable for a premium ecommerce homepage hero.\\n\\nPreferred:\\n- 6–10 seconds\\n- Smooth loop\\n- 16:9 composition\\n- Product centered\\n- Background clean and minimal\\n- High resolution\\n\\nThe final animation should look like an expensive premium supplement brand campaign, not a generic AI advertisement.\\n:::\\n\\n**Important\\\\:** Google Flow can generate the visual animation, but its output alone will not create cursor-responsive interaction on Shopify. For that, you need a real-time WebGL or CSS  Provide a checklist for testing responsiveness and performance.\\n\\nDo not merely create a static mockup. I need a functional, production-oriented Shopify hero section.\u003c/WritingBlock\u003e\\n\\n## 4. Exact prompt for Google Flow — animated product visuals\\n\\n\u003cbadge color=\\\"success\\\"\u003ePrompt 2 · Google Flow\u003c/badge\u003e\\n\\n\u003cWritingBlock id=\\\"83522\\\" variant=\\\"standard\\\"\u003eCreate a premium cinematic product animation for NUTRONYX ABC+ Daily Wellness Powder.\\n\\nREFERENCE:\\nUse my uploaded ABC+ pouch image as the exact packaging reference.\\n\\nThe packaging must remain identical to the reference:\\n- Same white pouch\\n- Same Nutronyx tree logo\\n- Same ABC+ typography\\n- Same burgundy lower section\\n- Same ingredient text\\n- Same proportions and branding\\n\\nDo not redesign, replace, distort, or invent packaging details.\\n\\nSCENE:\\nA luxurious natural wellness product hero scene on a warm ivory background.\\n\\nThe ABC+ pouch floats in the center of the composition.\\n\\nSurround it with realistic botanical ingredients:\\n- Amla / Indian gooseberry\\n- Beetroot\\n- Carrot\\n- Ginger\\n- Lemon\\n\\nThe ingredients float around the pouch in a sophisticated spherical arrangement.\\n\\nANIMATION:\\nThe pouch gently floats in the air.\\nIngredients move slowly around it along elegant circular orbital paths.\\nThe scene should feel like a premium 3D wellness advertisement.\\n\\nCAMERA:\\n- Centered product composition\\n- Slight perspective depth\\n- Slow cinematic movement\\n- Product remains clearly visible\\n- No rapid camera movement\\n- No dramatic zooms\\n- Clean premium studio lighting\\n\\nSTYLE:\\nLuxury wellness ecommerce.\\nPhotorealistic CGI.\\nEditorial art direction.\\nSoft shadows.\\nNatural highlights.\\nHigh-end commercial product photography.\\n\\nIMPORTANT:\\nDo not generate text overlays, additional logos, watermarks, or fake product labels.\\nPreserve the product packaging as accurately as possible. s at different depths.\\n- Add subtle floating motion.\\n- Use realistic scale differences.\\n- Keep the pouch readable and prominent.\\n- Use natural shadows and lighting.\\n\\nPRODUCT:\\nUse my exact pouch image.\\nDo not change the packaging artwork or branding.\\n\\nIf only the front pouch image is available:\\n- Create a flat transparent plane with the pouch image.\\n- Add a slight thickness illusion if appropriate.\\n- Do not invent the rear packaging artwork.\\n- Make the pouch rotate only within a realistic limited range.\\n- Avoid showing the flat image from extreme side angles.\\n\\nTECHNOLOGY:\\nUse Three.js.\\nUse transparent PNG textures.\\nUse a perspective camera.\\nUse a parent group for the spherical ingredient composition.\\nImplement pointer-based rotation using normalized mouse coordinates.\\nUse requestAnimationFrame.\\nUse damping / interpolation for smooth motion.\\nOptimize rendering performance.\\nSupport mobile touch interaction.\\nRespect reduced-motion accessibility settings.\\n\\nSHOPIFY:\\nProvide a complete Shopify-compatible implementation.\\nSeparate the code into:\\n- Liquid section\\n- HTML structure\\n- CSS\\n- JavaScript\\n- Asset loading\\n\\nAllow customization through Shopify section settings:\\n- Product pouch image\\n- Ingredient images\\n- Rotation sensitivity\\n- Floating animation speed\\n- Sphere radius\\n- Background color\\n- Desktop/mobile sizing\\n\\nOUTPUT:\\nProvide the full working code, not pseudocode.\\nExplain exactly where every file should be placed in Shopify.\\nExplain how to upload images to Shopify Files and reference them.\\nExplain how to add the section to the homepage.\\nExplain how to test mouse rotation, touch interaction, and responsive behavior.\\n\\nThe result should feel like a premium interactive 3D wellness ecommerce experience inspired by a rotating globe, with the actual ABC+ pouch as the centerpiece.\u003c/WritingBlock\u003e\\n\\n## 6. Recommended Shopify structure\\n\\n\u003cAsyncImage que
